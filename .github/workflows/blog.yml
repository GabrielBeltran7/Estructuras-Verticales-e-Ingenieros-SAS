name: Blog

# Después de que un post llega a main, avisa a los buscadores.
on:
  push:
    branches: [main]
    paths:
      - 'src/app/blog/posts/**'

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.estructurasverticales.com' }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Deja que Vercel termine de desplegar el post nuevo antes del ping.
      - run: sleep 90

      - name: Notify IndexNow / Search Console
        run: node scripts/blog/ping.mjs --since HEAD~1
